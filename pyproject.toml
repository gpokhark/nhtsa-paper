[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhtsa-complaint-defect-detection"
version = "0.1.0"
description = "LLM-assisted analysis of NHTSA consumer complaints and recall signals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.2",
    "openai>=1.0",
    "pydantic>=2.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.15",
    "requests>=2.31",
    "httpx>=0.27",
    "pyarrow>=15.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
nhtsa-pipeline = "nhtsa_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["nhtsa_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
